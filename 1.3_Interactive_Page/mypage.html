<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Interactive Page</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f2f6f0; color: #253d32; }
    main { width: min(500px, 85%); padding: 42px; background: white; border-radius: 14px; box-shadow: 0 12px 35px #263f3118; }
    h1 { font-size: 2.4rem; }
    p { color: #596d61; line-height: 1.6; }
    button { margin: 12px 8px 0 0; padding: 12px 18px; border: 0; border-radius: 6px; background: #315d49; color: white; cursor: pointer; font-size: 1rem; }
    button:hover { background: #477b62; }
    #resetButton { background: #e4ede5; color: #253d32; }
    button:focus-visible { outline: 3px solid #c17a47; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1 id="myHeading">Welcome!</h1>
    <p>Click the button to change the heading.</p>
    <button id="myButton">Click Me</button>
    <button id="resetButton">Change Back</button>
  </main>
  <script>
    // Find the heading and both buttons.
    let heading = document.getElementById('myHeading');
    let button = document.getElementById('myButton');
    let resetButton = document.getElementById('resetButton');

    // Change the heading text and colour when the button is clicked.
    button.addEventListener('click', function () {
      heading.textContent = 'You clicked the button!';
      heading.style.color = 'green';
    });

    // Change the heading back to its original text and colour.
    resetButton.addEventListener('click', function () {
      heading.textContent = 'Welcome!';
      heading.style.color = '';
    });
  </script>
</body>
</html>
